services:
  # ---------------------------------------------------------------------------
  # Message Broker
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: anirescue_rabbitmq
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"   # Local AMQP access only
      - "127.0.0.1:15672:15672" # Local management UI only
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anirescue_net

  # ---------------------------------------------------------------------------
  # Express Backend API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.backend
    container_name: anirescue_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FIREBASE_SERVICE_ACCOUNT_JSON=${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      - LOCATION_FRESHNESS_MINUTES=${LOCATION_FRESHNESS_MINUTES}
      - NOTIFICATION_RADIUS_KM=${NOTIFICATION_RADIUS_KM}
      - CORS_ORIGIN=${CORS_ORIGIN}
    # server.js owns migrations; keeping one migration owner avoids duplicate startup work.
    command: ["npm", "start"]
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - anirescue_net

  # ---------------------------------------------------------------------------
  # Python YOLO CPU Worker
  # ---------------------------------------------------------------------------
  yolo_worker:
    build:
      context: ./ai-async-worker
      dockerfile: Dockerfile.worker
    container_name: anirescue_yolo_worker
    restart: unless-stopped
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DATABASE_URL=${DATABASE_URL}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.8-flash}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_THINKING_LEVEL=${GEMINI_THINKING_LEVEL:-low}
      - GEMINI_TIMEOUT_MS=${GEMINI_TIMEOUT_MS:-120000}
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - YOLO_WORLD_OPENVINO_MODEL=/opt/yolo-world/yolo-world-anirescue_openvino_model
      - YOLO_WORLD_IMGSZ=512
      - YOLO_WORLD_CONF=0.20
      - YOLO_WORLD_MAX_DET=1
      - YOLO_WORLD_OPENVINO_THREADS=1
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
    depends_on:
      rabbitmq:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - anirescue_net

networks:
  anirescue_net:
    driver: bridge

volumes:
  rabbitmq_data:
