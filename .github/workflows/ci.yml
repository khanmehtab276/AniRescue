name: AniRescue CI

on:
  push:
    branches:
      - main
      - feat/yolo-world-production
      - research/experimental-results
      - production-hardening-v2
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        working-directory: .
        run: find Backend -path '*/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q ai-async-worker
      - name: Validate recorded research benchmark
        run: python ai-async-worker/benchmark/validate_research_result.py ai-async-worker/benchmark/results/yolo-world-openvino.json
