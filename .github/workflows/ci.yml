name: AniRescue CI

on:
  push:
    branches:
      - main
      - feat/yolo-world-production
      - research/experimental-results
      - production-hardening-v2
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - name: Verify MapLibre migration has no legacy Leaflet code
        run: |
          if grep -RInE 'leaflet|react-leaflet|MapContainer|TileLayer|useMapEvents' src --exclude-dir=node_modules; then
            echo "Legacy Leaflet map code detected."
            exit 1
          fi
          if grep -nE '"(leaflet|react-leaflet)"' package.json package-lock.json; then
            echo "Legacy Leaflet dependency detected."
            exit 1
          fi
          if test -e src/components/OfflinePinnedMap.jsx; then
            echo "Obsolete OfflinePinnedMap.jsx still exists."
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - name: Install Chromium for E2E
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
      - name: Run browser smoke tests
        run: npm run e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check JavaScript syntax
        working-directory: .
        run: find Backend -path '*/node_modules' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m compileall -q ai-async-worker
      - name: Validate current controlled research benchmark
        run: python ai-async-worker/benchmark/validate_research_result.py ai-async-worker/benchmark/results/yolo-world-openvino-1cpu-1gb.json

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run worker research tests
        run: python -m unittest ai-async-worker/test/test_worker_research.py
      - name: Check live research harness syntax
        run: node --check research/live/run_live_tests.js
